[project]
name = "mcp-signal"
version = "0.2.1"
description = "Local Signal MCP server: read via Signal Desktop, send via signal-cli"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Chris Lloyd-Jones" }
]
dependencies = [
    "cryptography>=50.0.0",
    "fastmcp==4.0.5",
    "signal-export==3.9.3",
]

[project.scripts]
signal-mcp = "mcp_signal.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]
